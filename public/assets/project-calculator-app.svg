<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="0.55" stop-color="#0f1f3a"/>
      <stop offset="1" stop-color="#081020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2533"/>
      <stop offset="1" stop-color="#06161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9ff"/>
      <stop offset="1" stop-color="#1e9bd7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- floating math symbols -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#38bdf8">
    <text x="210" y="250" font-size="120" opacity="0.18">+</text>
    <text x="300" y="690" font-size="110" opacity="0.14">÷</text>
    <text x="1290" y="260" font-size="120" opacity="0.16">×</text>
    <text x="1330" y="700" font-size="130" opacity="0.14">=</text>
    <text x="150" y="480" font-size="70" opacity="0.10">√x</text>
    <text x="1400" y="480" font-size="70" opacity="0.10">%</text>
  </g>

  <!-- calculator -->
  <g filter="url(#shadow)">
    <rect x="560" y="70" width="480" height="760" rx="48" fill="url(#body)" stroke="#334155" stroke-width="2"/>
  </g>
  <rect x="600" y="110" width="400" height="170" rx="24" fill="url(#screen)" stroke="#155e75" stroke-opacity="0.6" stroke-width="2"/>
  <text x="970" y="165" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="30" fill="#7dd3fc" opacity="0.75">1,250 × 12 + 84.5 =</text>
  <text x="970" y="250" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="600" fill="#e0f2fe">15,084.5</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" text-anchor="middle">
    <!-- row 1 -->
    <rect x="600" y="315" width="85" height="85" rx="22" fill="#334155"/><text x="642.5" y="370" fill="#cbd5e1">C</text>
    <rect x="705" y="315" width="85" height="85" rx="22" fill="#334155"/><text x="747.5" y="370" fill="#cbd5e1">±</text>
    <rect x="810" y="315" width="85" height="85" rx="22" fill="#334155"/><text x="852.5" y="370" fill="#cbd5e1">%</text>
    <rect x="915" y="315" width="85" height="85" rx="22" fill="url(#accent)"/><text x="957.5" y="370" fill="#06263a">÷</text>
    <!-- row 2 -->
    <rect x="600" y="420" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="642.5" y="475" fill="#f1f5f9">7</text>
    <rect x="705" y="420" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="747.5" y="475" fill="#f1f5f9">8</text>
    <rect x="810" y="420" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="852.5" y="475" fill="#f1f5f9">9</text>
    <rect x="915" y="420" width="85" height="85" rx="22" fill="url(#accent)"/><text x="957.5" y="475" fill="#06263a">×</text>
    <!-- row 3 -->
    <rect x="600" y="525" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="642.5" y="580" fill="#f1f5f9">4</text>
    <rect x="705" y="525" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="747.5" y="580" fill="#f1f5f9">5</text>
    <rect x="810" y="525" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="852.5" y="580" fill="#f1f5f9">6</text>
    <rect x="915" y="525" width="85" height="85" rx="22" fill="url(#accent)"/><text x="957.5" y="580" fill="#06263a">−</text>
    <!-- row 4 -->
    <rect x="600" y="630" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="642.5" y="685" fill="#f1f5f9">1</text>
    <rect x="705" y="630" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="747.5" y="685" fill="#f1f5f9">2</text>
    <rect x="810" y="630" width="85" height="85" rx="22" fill="#1f2a3c"/><text x="852.5" y="685" fill="#f1f5f9">3</text>
    <rect x="915" y="630" width="85" height="85" rx="22" fill="url(#accent)"/><text x="957.5" y="685" fill="#06263a">+</text>
    <!-- row 5 -->
    <rect x="600" y="735" width="190" height="70" rx="22" fill="#1f2a3c"/><text x="695" y="782" fill="#f1f5f9">0</text>
    <rect x="810" y="735" width="85" height="70" rx="22" fill="#1f2a3c"/><text x="852.5" y="782" fill="#f1f5f9">.</text>
    <rect x="915" y="735" width="85" height="70" rx="22" fill="#38bdf8"/><text x="957.5" y="782" fill="#06263a">=</text>
  </g>
</svg>
